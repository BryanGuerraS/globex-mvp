# Tema del panel de asesores de Globex (Streamlit >= 1.60)
# Base neutra (zinc) con los colores del logo: morado #2E1A47 y naranja #FF6900. Sin CSS inyectado: todo el
# estilo vive aquí para que sobreviva a las actualizaciones de Streamlit.

[theme]
base = "light"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#2E1A47"            # morado del logo: contraste AA con texto blanco
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
codeBackgroundColor = "#F4F4F5"
textColor = "#18181B"
linkColor = "#5B3A8C"
borderColor = "#E4E4E7"
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#F4F4F5"
# Colores semánticos (badges de estado y tiempo de espera)
greenColor = "#15803D"
orangeColor = "#E85F00"            # naranja del logo, un tono más oscuro para leerse en badges
redColor = "#B91C1C"
blueColor = "#2563EB"
violetColor = "#5B3A8C"
grayColor = "#71717A"

[theme.light.sidebar]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#18181B"
borderColor = "#E4E4E7"

[theme.dark]
primaryColor = "#A78BDA"            # morado claro: legible sobre fondo oscuro
backgroundColor = "#0B0B0F"
secondaryBackgroundColor = "#18181B"
codeBackgroundColor = "#18181B"
textColor = "#F4F4F5"
linkColor = "#C4B5E8"
borderColor = "#27272A"
dataframeBorderColor = "#27272A"
dataframeHeaderBackgroundColor = "#18181B"
greenColor = "#4ADE80"
orangeColor = "#FF8A33"
redColor = "#F87171"
blueColor = "#60A5FA"
violetColor = "#C4B5E8"
grayColor = "#A1A1AA"

[theme.dark.sidebar]
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
textColor = "#F4F4F5"
borderColor = "#27272A"

[client]
toolbarMode = "minimal"
