# Tema del panel de asesores de Globex (Streamlit >= 1.60)
# Base neutra (zinc) con un acento índigo de marca. Sin CSS inyectado: todo el
# estilo vive aquí para que sobreviva a las actualizaciones de Streamlit.

[theme]
base = "light"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#4338CA"            # índigo 700: contraste AA con texto blanco
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
codeBackgroundColor = "#F4F4F5"
textColor = "#18181B"
linkColor = "#4338CA"
borderColor = "#E4E4E7"
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#F4F4F5"
# Colores semánticos (badges de estado y tiempo de espera)
greenColor = "#15803D"
orangeColor = "#C2410C"
redColor = "#B91C1C"
blueColor = "#4338CA"
violetColor = "#6D28D9"
grayColor = "#71717A"

[theme.light.sidebar]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#18181B"
borderColor = "#E4E4E7"

[theme.dark]
primaryColor = "#818CF8"            # índigo 400: legible sobre fondo oscuro
backgroundColor = "#0B0B0F"
secondaryBackgroundColor = "#18181B"
codeBackgroundColor = "#18181B"
textColor = "#F4F4F5"
linkColor = "#A5B4FC"
borderColor = "#27272A"
dataframeBorderColor = "#27272A"
dataframeHeaderBackgroundColor = "#18181B"
greenColor = "#4ADE80"
orangeColor = "#FB923C"
redColor = "#F87171"
blueColor = "#818CF8"
violetColor = "#A78BFA"
grayColor = "#A1A1AA"

[theme.dark.sidebar]
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
textColor = "#F4F4F5"
borderColor = "#27272A"

[client]
toolbarMode = "minimal"
